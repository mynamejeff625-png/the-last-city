<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>THE LAST CITY — You vs AI</title>
<style>
:root{--bg:#080b10;--panel:#111722;--panel2:#171f2c;--text:#eef2f7;--muted:#8d9aaa;--accent:#7dd3fc;--danger:#fb7185;--good:#86efac;--gold:#facc15}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#172132 0,#080b10 55%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh}
.wrap{max-width:720px;margin:auto;padding:18px 14px 34px}.title{font-size:28px;font-weight:900;letter-spacing:.04em}.sub{color:var(--muted);margin:2px 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:rgba(17,23,34,.94);border:1px solid #273244;border-radius:16px;padding:13px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.big{font-size:22px;font-weight:800;margin-top:3px}
.hp{height:8px;background:#26303d;border-radius:99px;overflow:hidden;margin-top:7px}.hp>i{display:block;height:100%;background:var(--good);width:100%}
.scene{margin-top:12px;background:linear-gradient(145deg,#151e2a,#0e141d);border:1px solid #2b3749;border-radius:18px;padding:16px}.scene h2{margin:0 0 7px}.scene p{line-height:1.5;color:#cbd5e1}
.log{margin-top:12px;max-height:190px;overflow:auto;display:flex;flex-direction:column;gap:7px}.msg{padding:9px 11px;border-radius:12px;background:#111722;color:#cbd5e1;font-size:14px}.msg.you{border-left:3px solid var(--accent)}.msg.ai{border-left:3px solid #c084fc}.msg.system{border-left:3px solid var(--gold)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}button{border:1px solid #344154;background:#182130;color:var(--text);border-radius:14px;padding:13px 10px;font-size:15px;font-weight:750;min-height:52px}button:active{transform:scale(.98);background:#222e40}.danger{border-color:#713244}.gold{border-color:#66551c}
.footer{display:flex;gap:8px;margin-top:12px}.footer button{flex:1;font-size:13px;min-height:42px;padding:9px}
.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#172235;color:var(--accent);font-size:12px;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">THE LAST CITY</div>
  <div class="sub">A tiny survival game. <span class="badge">YOU vs AI</span></div>

  <div class="grid">
    <div class="card"><div class="label">Health</div><div class="big" id="hpText">10 / 10</div><div class="hp"><i id="hpBar"></i></div></div>
    <div class="card"><div class="label">Day</div><div class="big" id="day">1</div></div>
    <div class="card"><div class="label">Supplies</div><div class="big" id="supplies">3</div></div>
    <div class="card"><div class="label">Trust</div><div class="big" id="trust">0</div></div>
  </div>

  <div class="scene">
    <h2 id="location">🏙️ Downtown</h2>
    <p id="story">The city went silent three days ago. Your radio picked up one repeating message: “If you can hear this, don't go to the tower.” A storm is moving in.</p>
  </div>

  <div class="log" id="log"></div>
  <div class="actions" id="actions"></div>
  <div class="footer">
    <button onclick="newGame()">↻ New game</button>
    <button onclick="aiHint()">🤖 Ask the AI</button>
  </div>
</div>

<script>
const S={hp:10,day:1,supplies:3,trust:0,loc:"Downtown",ended:false,turn:0};
const scenes=[
 {name:"🏙️ Downtown",text:"The streets are empty. A pharmacy has its door half-open. Somewhere above you, glass breaks.",acts:[
  ["🔍 Search pharmacy",()=>{S.supplies++; log("you","You search the pharmacy and find a sealed medical kit. +1 supply."); chance(.25,2,"A shelf collapses while you search.")}],
  ["🚶 Head to tower",()=>{S.loc="Radio Tower"; S.day++; S.supplies--; log("you","You head toward the radio tower. -1 supply.");}],
  ["🏚️ Barricade & rest",()=>{S.hp=Math.min(10,S.hp+2);S.day++;S.supplies--;log("you","You barricade a storefront and rest. +2 health, -1 supply.");}]
 ]},
 {name:"📡 Radio Tower",text:"The tower hums even though the grid is supposedly dead. Your radio suddenly speaks in your own voice.",acts:[
  ["📻 Answer the radio",()=>{S.trust+=2;S.day++;log("you","You answer. Something on the other end knows your name. Trust +2.")}],
  ["⬆️ Climb the tower",()=>{chance(.45,3,"A violent electrical surge throws you against the stairs.");S.day++;}],
  ["🏃 Leave immediately",()=>{S.loc="Subway";S.day++;log("you","You leave the tower and descend into the subway.");}]
 ]},
 {name:"🚇 Subway",text:"Emergency lights flicker beneath the city. A stranger is sitting beside a dead train, holding a working flashlight.",acts:[
  ["🤝 Talk to stranger",()=>{S.trust++;S.supplies++;log("you","The stranger gives you a ration and says: “The city isn't empty.” Trust +1, supply +1.")}],
  ["🥷 Sneak past",()=>{S.day++;log("you","You avoid the stranger and slip deeper underground.")}],
  ["⚔️ Threaten them",()=>{S.trust-=2;S.supplies+=2;log("you","You take their supplies. +2 supply, Trust -2.");}]
 ]}
];
function current(){return scenes.find(x=>x.name===S.loc)||scenes[0]}
function log(who,text){let d=document.createElement("div");d.className="msg "+who;d.textContent=(who==="you"?"YOU: ":who==="ai"?"AI: ":"SYSTEM: ")+text;document.getElementById("log").prepend(d)}
function chance(p,damage,msg){if(Math.random()<p){S.hp=Math.max(0,S.hp-damage);log("system",msg+" -"+damage+" health.")}}
function render(){
 document.getElementById("hpText").textContent=S.hp+" / 10";document.getElementById("hpBar").style.width=(S.hp*10)+"%";
 document.getElementById("day").textContent=S.day;document.getElementById("supplies").textContent=S.supplies;document.getElementById("trust").textContent=S.trust;
 let c=current();document.getElementById("location").textContent=c.name;document.getElementById("story").textContent=c.text;
 let a=document.getElementById("actions");a.innerHTML="";
 c.acts.forEach(([label,fn],i)=>{let b=document.createElement("button");b.textContent=label;b.onclick=()=>{if(S.ended)return;fn();S.turn++;aiTurn();check();render()};a.appendChild(b)});
}
function aiTurn(){if(S.ended)return;if(Math.random()<.45){let lines=["The storm is getting closer.","I don't trust that tower.","Something is moving underground.","You have one advantage: nobody knows what you'll do next."];log("ai",lines[Math.floor(Math.random()*lines.length)])}}
function aiHint(){let hints=S.hp<=4?"You need safety. Resting is probably smarter than exploring.":S.supplies<=1?"Supplies are getting low. Search for resources.":S.trust<0?"People may become a problem if you keep pushing them.":"I'd investigate the radio, but I wouldn't assume the voice is friendly.";log("ai",hints)}
function check(){
 if(S.hp<=0){S.ended=true;document.getElementById("actions").innerHTML="";log("system","GAME OVER. The city wins this time. Tap New game to try again.");return}
 if(S.day>=7){S.ended=true;document.getElementById("actions").innerHTML="";let result=S.trust>=3?"You reach the evacuation signal—and the stranger recognizes you. You survived.":"You reach the edge of the city alone. You survived, but you still don't know what was speaking on the radio.";log("system","DAY 7 — "+result)}
 if(S.supplies<0)S.supplies=0;
}
function newGame(){Object.assign(S,{hp:10,day:1,supplies:3,trust:0,loc:"Downtown",ended:false,turn:0});document.getElementById("log").innerHTML="";log("system","New game started. Make your first move.");render()}
log("system","I'm your AI game master. You can also ask me for a hint.");render();
</script>
</body>
</html>
