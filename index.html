<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The Last City V2</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080b10;color:#eef3fa;font-family:system-ui,-apple-system,sans-serif}.app{max-width:700px;margin:auto;padding:16px}.hud{position:sticky;top:0;background:#080b10ee;padding:10px 0;z-index:2}.row,.stats,.actions,.map{display:grid;gap:8px}.stats{grid-template-columns:repeat(4,1fr)}.stat,.panel,.place,button{background:#111a27;border:1px solid #2c3b50;border-radius:14px}.stat{padding:8px;text-align:center}.stat b{display:block;font-size:18px}.panel{padding:16px;margin:10px 0}.hero{min-height:210px;background:linear-gradient(#162840,#0e151f);display:flex;flex-direction:column;justify-content:flex-end}.muted{color:#91a0b5;font-size:12px;letter-spacing:.08em}.radio{border-left:3px solid #c084fc;padding:9px;background:#19182a;margin-top:10px}.actions,.map{grid-template-columns:1fr 1fr}button{color:#eef3fa;padding:12px;font-weight:700;font-size:14px}.place{padding:12px}.here{border-color:#7dd3fc}.locked{opacity:.35}.tabs{display:flex;gap:6px}.tabs button{flex:1}.entry{padding:8px;border-left:2px solid #64748b;margin:6px 0;background:#0d141e}.item{display:flex;justify-content:space-between;align-items:center;padding:9px;border-bottom:1px solid #263448}.overlay{position:fixed;inset:0;background:#05070bed;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}.hidden{display:none}.modal{max-width:480px;background:#111a27;border:1px solid #3b4d67;border-radius:18px;padding:20px}</style></head>
<body><div class="app"><div class="hud"><b>THE LAST CITY <span style="color:#7dd3fc">V2</span></b><div class="stats"><div class="stat">❤️<b id="hp"></b></div><div class="stat">🍖<b id="food"></b></div><div class="stat">⚡<b id="energy"></b></div><div class="stat">🎒<b id="bag"></b></div></div></div>
<div class="panel hero"><div class="muted" id="day"></div><h1 id="loc"></h1><p id="desc"></p><div class="radio" id="radio"></div></div>
<div class="actions"><button onclick="searchArea()">🔎 Search Area</button><button onclick="investigate()">👁 Investigate</button><button onclick="rest()">💤 Rest</button><button onclick="askAI()">📻 Ask the Voice</button></div>
<div class="tabs"><button onclick="tab='map';render()">🗺 World</button><button onclick="tab='bag';render()">🎒 Inventory</button><button onclick="tab='log';render()">📓 Journal</button></div><div class="panel" id="content"></div></div>
<div id="enc" class="overlay hidden"><div class="modal"><div class="muted">ENCOUNTER</div><h2 id="enemy"></h2><p id="etext"></p><div class="actions"><button onclick="fight()">⚔️ Fight</button><button onclick="flee()">🏃 Run</button><button onclick="med()">🩹 Medkit</button><button onclick="hideEnemy()">🫥 Hide</button></div></div></div>
<script>
const P={Downtown:["🏙️","Rain glitters on abandoned cars. The pharmacy door hangs open.",["Hospital","Subway"],["Canned Food","Bandage","Battery"]],Hospital:["🏥","Emergency lights pulse red. A trail leads toward Surgery.",["Downtown","Apartments"],["Medkit","Antibiotics","Canned Food"]],Subway:["🚇","A dead train blocks the platform. Footsteps echo below.",["Downtown","Police Station"],["Battery","Crowbar","Canned Food"]],Apartments:["🏚️","Someone wrote DON'T ANSWER THEM across the wall.",["Hospital","Radio Tower"],["Keycard","Canned Food","Medkit"]],"Police Station":["🚔","The security room still has power. A city map flickers.",["Subway","Radio Tower"],["Armor","Battery","Medkit"]],"Radio Tower":["📡","The tower hums. Your radio speaks before you touch it.",["Apartments","Police Station"],["Signal Core"]]};
let S=JSON.parse(localStorage.getItem("tlcV2")||"null")||{hp:100,food:80,energy:85,day:1,hour:18,loc:"Downtown",inv:["Flashlight"],seen:["Downtown","Hospital","Subway"],log:["You woke Downtown. One message repeats: DON'T GO TO THE TOWER."],searched:{},trust:0},tab="map",foe=null;
const save=()=>localStorage.setItem("tlcV2",JSON.stringify(S));function tick(h=1){S.hour+=h;S.energy=Math.max(0,S.energy-h*3);S.food=Math.max(0,S.food-h*2);if(S.hour>=24){S.hour-=24;S.day++}if(!S.food||!S.energy)S.hp-=4;save()}function note(x){S.log.unshift(x);save();render()}
function move(x){if(!S.seen.includes(x)||x===S.loc)return;S.loc=x;tick();note("Traveled to "+x+".");if(Math.random()<.25)encounter()}
function searchArea(){let n=S.searched[S.loc]||0;if(n>=2)return note("This area has been picked clean.");S.searched[S.loc]=n+1;tick();let a=P[S.loc][3],x=a[Math.floor(Math.random()*a.length)];if(S.inv.length<8){S.inv.push(x);note("Found "+x+".")}else note("Found "+x+", but your pack is full.");if(Math.random()<.3)encounter()}
function investigate(){tick();let u=P[S.loc][2].filter(x=>!S.seen.includes(x));if(u.length){S.seen.push(u[0]);note("Discovered a route to "+u[0]+".")}else note(["Fresh footprints cross your path.","A radio repeats the numbers 3-1-7.","A locked door rattles, then goes silent.","Blue chalk marks a safe route."][Math.floor(Math.random()*4)])}
function rest(){if(S.food<8)return note("You're too hungry to rest.");S.food-=8;S.energy=Math.min(100,S.energy+40);S.hp=Math.min(100,S.hp+8);tick(6);note("You barricaded a room and slept.");if(Math.random()<.15)encounter()}
function askAI(){S.trust++;note(S.loc==="Radio Tower"?'VOICE: "The signal is not coming FROM the tower."':S.hp<40?'VOICE: "Find medicine. Now."':S.energy<30?'VOICE: "You are exhausted. Find shelter."':'VOICE: "'+["Someone else has a radio.","The tower gets louder after midnight.","You are being followed."][Math.floor(Math.random()*3)]+'"')}
function encounter(){foe={name:["The Hollow","Tunnel Stalker","Lost Survivor"][Math.floor(Math.random()*3)],hp:30};enemy.textContent=foe.name;etext.textContent="Movement erupts nearby. Decide fast.";enc.classList.remove("hidden")}
function fight(){foe.hp-=S.inv.includes("Crowbar")?18:10;S.hp-=5+Math.floor(Math.random()*9);tick();if(foe.hp<=0){enc.classList.add("hidden");note("You survived the encounter.")}else etext.textContent="It is still coming. Enemy health: "+foe.hp}
function flee(){tick();if(Math.random()<.65){enc.classList.add("hidden");note("You escaped.")}else{S.hp-=12;etext.textContent="It catches you. -12 health."}}
function med(){let i=S.inv.indexOf("Medkit");if(i<0)return etext.textContent="No Medkit.";S.inv.splice(i,1);S.hp=Math.min(100,S.hp+35);render()}function hideEnemy(){tick();if(Math.random()<.55){enc.classList.add("hidden");note("It passes without seeing you.")}else etext.textContent="It heard you."}
function use(i){let x=S.inv[i];if(x==="Canned Food"){S.food=Math.min(100,S.food+30);S.inv.splice(i,1);note("Ate canned food.")}else if(x==="Medkit"||x==="Bandage"){S.hp=Math.min(100,S.hp+(x==="Medkit"?35:15));S.inv.splice(i,1);note("Used "+x+".")}else note(x+" may be useful later.")}
function render(){hp.textContent=Math.max(0,S.hp);food.textContent=S.food;energy.textContent=S.energy;bag.textContent=S.inv.length+"/8";day.textContent="DAY "+S.day+" • "+String(S.hour).padStart(2,"0")+":00 • "+(S.hour<6||S.hour>=20?"NIGHT":"DAYLIGHT");loc.textContent=P[S.loc][0]+" "+S.loc;desc.textContent=P[S.loc][1];radio.textContent=S.loc==="Radio Tower"?'📻 “You’re standing directly above it.”':'📻 “If you can hear this, don’t go to the tower.”';
if(tab==="map")content.innerHTML='<div class="muted">CITY MAP • TAP TO TRAVEL</div><div class="map">'+Object.keys(P).map(x=>'<div onclick="move(\''+x+'\')" class="place '+(x===S.loc?"here ":"")+(S.seen.includes(x)?"":"locked")+'"><b>'+P[x][0]+" "+x+'</b><br><span class="muted">'+(x===S.loc?"YOU ARE HERE":S.seen.includes(x)?"ROUTE KNOWN":"UNDISCOVERED")+"</span></div>").join("")+"</div>";
if(tab==="bag")content.innerHTML='<div class="muted">BACKPACK</div>'+S.inv.map((x,i)=>'<div class="item"><b>'+x+'</b><button onclick="use('+i+')">USE</button></div>').join("");
if(tab==="log")content.innerHTML='<div class="muted">SURVIVAL JOURNAL</div>'+S.log.map(x=>'<div class="entry">'+x+"</div>").join("");save();if(S.hp<=0){alert("You died. Refresh after clearing site data to restart.")}}
render();
</script></body></html>
