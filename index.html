<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070b10"><title>The Last City — V3: Outbreak</title>
<style>
*{box-sizing:border-box} :root{--bg:#070b10;--panel:#0e1722;--panel2:#142131;--line:#293b50;--text:#eef4fb;--muted:#8798aa;--cyan:#7dd3fc;--red:#fb7185;--green:#86efac;--violet:#c4b5fd;--gold:#fde68a}
html,body{margin:0;min-height:100%;background:#070b10;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background:radial-gradient(circle at 50% -10%,#172a40,#070b10 45%);overflow-x:hidden}
#app{max-width:760px;margin:auto;padding:0 13px calc(24px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:8;background:#070b10e8;backdrop-filter:blur(14px);padding:calc(9px + env(safe-area-inset-top)) 0 9px;border-bottom:1px solid #162332}
.top{display:flex;align-items:center;justify-content:space-between}.logo{font-weight:950;letter-spacing:.1em;font-size:14px}.logo i{font-style:normal;color:var(--red)}.clock{font-size:12px;color:var(--muted)}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.stat{background:#0e1722;border:1px solid #223247;border-radius:10px;padding:6px;text-align:center;font-size:11px;color:var(--muted)}.stat b{display:block;color:var(--text);font-size:15px;margin-top:1px}
.scene{height:300px;margin-top:12px;border-radius:20px;overflow:hidden;border:1px solid #2a3b50;position:relative;background:#0c1520;transition:.35s transform,.35s opacity}
.scene.travel{transform:scale(.975);opacity:.35}.sky,.city,.ground,.fog,.rain,.person{position:absolute}.sky{inset:0;background:linear-gradient(#142b43,#172536 52%,#0a1119)}.city{left:0;right:0;bottom:28%;height:45%;background:linear-gradient(90deg,#101923 5%,transparent 5% 8%,#111c27 8% 18%,transparent 18% 21%,#0c151f 21% 35%,transparent 35% 39%,#111a25 39% 54%,transparent 54% 57%,#0d1721 57% 72%,transparent 72% 76%,#101923 76%);filter:drop-shadow(0 -1px 0 #26384d)}.ground{inset:72% 0 0;background:linear-gradient(#101821,#070b10)}.fog{inset:40% -20% 0;background:radial-gradient(ellipse,#a9c3d214,transparent 65%);animation:fog 8s ease-in-out infinite alternate}.rain{inset:0;background:repeating-linear-gradient(105deg,transparent 0 15px,#b8d8ee1b 16px 17px,transparent 18px 28px);animation:rain .45s linear infinite}.person{display:none;width:58px;height:125px;left:50%;bottom:20%;transform:translateX(-50%);background:linear-gradient(#111827,#06090d);border-radius:48% 48% 18% 18%;filter:drop-shadow(0 0 12px #000)}.person:before{content:"";position:absolute;width:38px;height:38px;border-radius:50%;background:#111827;left:10px;top:-22px}.person.show{display:block;animation:appear .5s ease}.sceneText{position:absolute;inset:auto 0 0;padding:48px 15px 14px;background:linear-gradient(transparent,#070b10ee)}.sceneText .small{color:#9fb0c2;font-size:11px;letter-spacing:.12em}.sceneText h1{margin:3px 0 4px;font-size:26px}.sceneText p{margin:0;color:#c8d2de;line-height:1.4;font-size:14px}
@keyframes rain{to{background-position:0 28px}}@keyframes fog{to{transform:translateX(8%)}}@keyframes appear{from{opacity:0;transform:translateX(-50%) translateY(12px)}}
.radio{margin-top:9px;padding:10px 12px;background:#171728;border:1px solid #383052;border-left:3px solid var(--violet);border-radius:11px;color:#ddd6fe;font-size:13px}
.card{background:linear-gradient(145deg,#101a27,#0b121b);border:1px solid var(--line);border-radius:16px;padding:13px;margin-top:10px}.label{font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}button{min-height:45px;border-radius:12px;border:1px solid #344a63;background:#152335;color:var(--text);font-weight:750;font-size:13px;padding:10px}button:active{transform:scale(.98);background:#20344c}button.red{border-color:#74384a}button.green{border-color:#35644b}
.tabs{display:flex;gap:6px;margin-top:10px}.tabs button{flex:1;min-height:38px;font-size:11px;padding:7px}.selected{border-color:var(--cyan);background:#1a3044}
.map{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.place{background:#0b131d;border:1px solid #25384d;border-radius:11px;padding:10px}.place.here{border-color:var(--cyan)}.place.lock{opacity:.32}.place small{display:block;color:var(--muted);margin-top:3px}
.item,.npcrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #1d2b3b}.item button{min-height:34px;padding:6px 10px}
.journal{max-height:250px;overflow:auto}.entry{font-size:12px;line-height:1.45;color:#c7d2df;border-left:2px solid #40556e;padding:6px 9px;margin:5px 0}.entry.story{border-color:var(--violet)}.entry.danger{border-color:var(--red)}
.free{display:flex;gap:7px;margin-top:9px}.free input{flex:1;min-width:0;background:#090f17;border:1px solid #30445b;border-radius:12px;color:white;padding:12px;font-size:14px;outline:none}.free input:focus{border-color:var(--cyan)}.free button{min-width:70px}
.overlay{position:fixed;inset:0;z-index:30;background:#030609ed;display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(6px)}.modal{width:min(100%,520px);background:#101a27;border:1px solid #3a4e68;border-radius:20px;padding:18px;box-shadow:0 25px 80px #000}.hidden{display:none!important}.portrait{height:125px;border-radius:14px;background:radial-gradient(circle at 50% 28%,#475569 0 14%,#182332 15% 32%,#0a1018 33%);margin:10px 0;border:1px solid #2d4057}.death{text-align:center}.death h1{font-size:40px;color:var(--red);margin:8px}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#111c29;border:1px solid #38506a;border-radius:999px;padding:9px 14px;font-size:12px;z-index:50;animation:toast 2.3s forwards}@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}15%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
</style></head>
<body><div id="app">
<header><div class="top"><div class="logo">THE LAST CITY <i>V3 // OUTBREAK</i></div><div class="clock" id="clock"></div></div>
<div class="hud"><div class="stat">HEALTH<b id="hp"></b></div><div class="stat">HUNGER<b id="food"></b></div><div class="stat">ENERGY<b id="energy"></b></div><div class="stat">PACK<b id="pack"></b></div></div></header>
<div class="scene" id="scene"><div class="sky"></div><div class="city" id="cityart"></div><div class="ground"></div><div class="fog"></div><div class="rain"></div><div class="person" id="person"></div><div class="sceneText"><div class="small" id="sceneMeta"></div><h1 id="loc"></h1><p id="desc"></p></div></div>
<div class="radio" id="radio"></div>
<div class="card"><div class="label">Your move</div><div class="actions" id="actions"></div>
<div class="free"><input id="freeText" maxlength="120" placeholder="Type what you want to do…"><button onclick="freeAction()">DO IT</button></div></div>
<div class="tabs"><button id="tm" onclick="setTab('map')">🗺 WORLD</button><button id="ti" onclick="setTab('inventory')">🎒 PACK</button><button id="tn" onclick="setTab('people')">👥 PEOPLE</button><button id="tj" onclick="setTab('journal')">📓 STORY</button></div>
<div class="card" id="content"></div></div>
<div class="overlay hidden" id="encounter"><div class="modal"><div class="label" id="encType"></div><div class="portrait" id="portrait"></div><h2 id="encName"></h2><p id="encText"></p><div class="actions" id="encActions"></div></div></div>
<div class="overlay hidden" id="death"><div class="modal death"><div class="label">RUN ENDED</div><h1>YOU DIED</h1><p id="deathStats"></p><button class="red" onclick="restart()">BEGIN A NEW RUN</button></div></div>
<script>
const W={
"Downtown":{i:"🏙️",d:"Rain sheets across abandoned cars. The pharmacy sign flickers above an open door.",links:["Hospital","Subway"],loot:["Canned Food","Bandage","Battery"],tone:"city"},
"Hospital":{i:"🏥",d:"Red emergency lights pulse through Saint Mercy. A dark trail disappears behind Surgery.",links:["Downtown","Apartments"],loot:["Medkit","Antibiotics","Bandage"],tone:"hospital"},
"Subway":{i:"🚇",d:"Warm air breathes from the tunnel. A dead train blocks the north platform.",links:["Downtown","Police Station"],loot:["Canned Food","Battery","Crowbar"],tone:"subway"},
"Apartments":{i:"🏚️",d:"Apartment doors hang open. Across the wallpaper: DON'T ANSWER THEM.",links:["Hospital","Radio Tower"],loot:["Canned Food","Keycard","Medkit"],tone:"apartments"},
"Police Station":{i:"🚔",d:"The lobby is wrecked. One security monitor still displays a map of the quarantine zone.",links:["Subway","Radio Tower"],loot:["Armor","Battery","Medkit"],tone:"police"},
"Radio Tower":{i:"📡",d:"The tower vibrates beneath the storm. Your teeth ache as the radio frequency climbs.",links:["Apartments","Police Station"],loot:["Signal Core"],tone:"tower"}
};
const fresh=()=>({hp:100,food:82,energy:88,day:1,hour:18,loc:"Downtown",inv:["Flashlight"],seen:["Downtown","Hospital","Subway"],searched:{},journal:["DAY 1 — You woke to a city-wide emergency frequency. One sentence repeats: “If you can hear this, don't go to the tower.”"],people:{},flags:{metMaya:false,mayaJoined:false,towerClue:false,stageIV:false},trust:0,kills:0});
let S=JSON.parse(localStorage.getItem("tlcV3")||"null")||fresh(), tab="map", currentEncounter=null, locked=false;
function save(){localStorage.setItem("tlcV3",JSON.stringify(S))}
function alive(){if(S.hp<=0){S.hp=0;locked=true;save();deathStats.textContent=`You survived ${S.day} day${S.day===1?"":"s"}, discovered ${S.seen.length}/6 locations, and survived ${S.kills} hostile encounter${S.kills===1?"":"s"}.`;death.classList.remove("hidden");return false}return true}
function tick(h=1){if(!alive())return;S.hour+=h;S.energy=Math.max(0,S.energy-h*3);S.food=Math.max(0,S.food-h*2);while(S.hour>=24){S.hour-=24;S.day++;restock()}if(S.food===0)S.hp-=5;if(S.energy===0)S.hp-=4;save();alive()}
function restock(){for(const k in S.searched)S.searched[k]=Math.max(0,S.searched[k]-1);story(`Dawn reaches the city. Some abandoned locations may have new supplies.`)}
function story(x,type="story"){S.journal.unshift(x);S.journal=S.journal.slice(0,50);save();render();toast(x)}
function toast(x){let d=document.createElement("div");d.className="toast";d.textContent=x.length>75?x.slice(0,72)+"…":x;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function transition(fn){scene.classList.add("travel");setTimeout(()=>{fn();render();scene.classList.remove("travel")},300)}
function move(p){if(locked||!S.seen.includes(p)||p===S.loc)return;transition(()=>{S.loc=p;tick(1);story(`You traveled to ${p}.`);if(p==="Subway"&&!S.flags.metMaya)meetMaya();else if(Math.random()<.22)randomEncounter()})}
function searchArea(){if(!alive()||locked)return;let n=S.searched[S.loc]||0;if(n>=2)return story("You've exhausted the obvious supplies here. More may appear after another day passes.");S.searched[S.loc]=n+1;tick(1);let pool=W[S.loc].loot,x=pool[Math.floor(Math.random()*pool.length)];if(S.inv.length>=8)story(`You found ${x}, but your pack is full.`);else{S.inv.push(x);story(`You searched ${S.loc} and found ${x}.`)}if(Math.random()<.25)randomEncounter()}
function investigate(){if(!alive()||locked)return;tick(1);let u=W[S.loc].links.filter(x=>!S.seen.includes(x));if(u.length){S.seen.push(u[0]);story(`You discovered a route to ${u[0]}.`);return}let events=S.loc==="Hospital"?["A patient chart describes headaches, auditory hallucinations, then violent behavioral changes.","Behind a locked ward door, something whispers a nurse's name over and over."]:S.loc==="Radio Tower"?["The tower's maintenance log says the emergency signal began BEFORE the first reported infection.","A buried cable descends beneath the tower instead of connecting to its antenna."]:["Fresh footprints cross your path.","Blue chalk marks a route somebody considers safe.","Your radio clicks three times: 3 — 1 — 7.","You find a quarantine notice describing the infected as living patients, not corpses."];let e=events[Math.floor(Math.random()*events.length)];if(S.loc==="Radio Tower")S.flags.towerClue=true;story(e)}
function rest(){if(!alive()||locked)return;if(S.food<10)return story("You're too hungry to sleep safely.");S.food-=10;S.energy=Math.min(100,S.energy+45);S.hp=Math.min(100,S.hp+10);tick(6);story("You barricade the room and sleep for several hours.");if(Math.random()<.14)randomEncounter()}
function askVoice(){if(!alive()||locked)return;S.trust++;let x=S.loc==="Radio Tower"?'VOICE: “The antenna is a decoy. Whatever is transmitting is below you.”':S.flags.metMaya&&!S.flags.mayaJoined?'VOICE: “Maya is afraid of you. That does not mean she is lying.”':S.hp<35?'VOICE: “Your pulse is slowing. Find medicine.”':['VOICE: “The Hollow remember fragments of who they were.”','VOICE: “The first emergency call came from Saint Mercy Hospital.”','VOICE: “Do not assume infection means death.”'][Math.floor(Math.random()*3)];story(x)}
function meetMaya(){S.flags.metMaya=true;S.people.Maya={trust:20,status:"Alive",location:"Subway",known:"A survivor found beside the dead train."};save();showNPC("Maya","Friendly survivor","A young woman steps from behind the train with both hands raised. A backpack hangs from one shoulder. “I'm Maya. I'm not infected.”",["Talk","Ask about infection","Offer food","Invite her","Leave"])}
function showNPC(name,type,text,opts){currentEncounter={kind:"npc",name};encType.textContent=type;encName.textContent=name;encText.textContent=text;person.classList.add("show");encActions.innerHTML="";opts.forEach(o=>{let b=document.createElement("button");b.textContent=o;b.onclick=()=>npcAction(o);encActions.appendChild(b)});encounter.classList.remove("hidden")}
function npcAction(a){let m=S.people.Maya;if(a==="Talk"){m.trust+=8;encText.textContent='Maya lowers her hands. “The outbreak started with headaches. Then people began hearing voices from radios that weren’t turned on.”'}else if(a==="Ask about infection"){m.trust-=2;encText.textContent='Her expression hardens. “I was tested before the hospital fell. Negative. That was four days ago.” She rubs the side of her neck.'}else if(a==="Offer food"){let i=S.inv.indexOf("Canned Food");if(i<0)return encText.textContent="You don't have food to spare.";S.inv.splice(i,1);m.trust+=18;encText.textContent='Maya accepts it after a long pause. “Okay… maybe I misjudged you.”'}else if(a==="Invite her"){if(m.trust>=35){S.flags.mayaJoined=true;m.location="With you";m.status="Companion";encText.textContent='Maya nods. “Fine. But if either of us starts hearing things, we tell the other. Deal?”'}else encText.textContent='“I don’t know you well enough.”'}else{encounter.classList.add("hidden");person.classList.remove("show");story("You leave Maya by the train.");return}save();render()}
function randomEncounter(){let friendly=Math.random()<.32;if(friendly){let names=["Elias","June","Marcus"],name=names[Math.floor(Math.random()*names.length)];S.people[name]=S.people[name]||{trust:10,status:"Alive",location:S.loc,known:"A survivor you encountered."};showNPC(name,"Unknown survivor",`${name} emerges cautiously from cover. They look exhausted, but not immediately hostile.`,["Talk","Trade","Ask about Hollow","Leave"]);return}let types=[["Hollow","Stage III infected"],["Echo","Stage II infected"],["Stalker","Unknown infected variant"]],x=types[Math.floor(Math.random()*types.length)];currentEncounter={kind:"hostile",name:x[0],hp:x[0]==="Hollow"?38:28};encType.textContent=x[1];encName.textContent=x[0];encText.textContent=x[0]==="Echo"?'It stands in the dark repeating a child’s voice: “Mom? I’m downstairs.”':"It moves toward you with a violent, uneven gait.";encActions.innerHTML="";[["⚔️ Fight","fight()"],["🏃 Run","flee()"],["🫥 Hide","hideHostile()"],["🩹 Medkit","med()"]].forEach(([t,f])=>{let b=document.createElement("button");b.textContent=t;b.setAttribute("onclick",f);encActions.appendChild(b)});encounter.classList.remove("hidden")}
function fight(){if(!alive())return;let dmg=S.inv.includes("Crowbar")?20:12;currentEncounter.hp-=dmg;let hit=6+Math.floor(Math.random()*10);S.hp-=hit;tick(1);if(currentEncounter.hp<=0){S.kills++;encounter.classList.add("hidden");story(`You survived the ${currentEncounter.name}.`)}else encText.textContent=`You hit it, but it hits back (-${hit} HP). It has ${currentEncounter.hp} health left.`;render();alive()}
function flee(){tick(1);if(Math.random()<.65){encounter.classList.add("hidden");story("You escape the encounter.")}else{S.hp-=14;encText.textContent="It cuts off your escape. -14 HP.";render();alive()}}
function hideHostile(){tick(1);if(Math.random()<.55){encounter.classList.add("hidden");story("You hold your breath until it passes.")}else encText.textContent="It heard you. Hiding won't work twice."}
function med(){let i=S.inv.indexOf("Medkit");if(i<0)return encText.textContent="No Medkit in your pack.";S.inv.splice(i,1);S.hp=Math.min(100,S.hp+38);encText.textContent="You patch yourself up. +38 HP.";save();render()}
function useItem(i){if(!alive())return;let x=S.inv[i];if(x==="Canned Food"){S.food=Math.min(100,S.food+32);S.inv.splice(i,1);story("You eat the canned food.")}else if(x==="Medkit"||x==="Bandage"){S.hp=Math.min(100,S.hp+(x==="Medkit"?38:16));S.inv.splice(i,1);story(`You use ${x}.`)}else story(`${x} isn't useful here yet.`)}
function freeAction(){if(!alive()||locked)return;let q=freeText.value.trim();if(!q)return;freeText.value="";let s=q.toLowerCase(),r="";tick(1);
if(s.includes("maya")&&S.flags.metMaya){let m=S.people.Maya;if(s.includes("talk")||s.includes("ask")){m.trust+=3;r=`You approach Maya and ${q.toLowerCase()}. She listens carefully. “I don't know everything. But the voices started before the Hollow did.”`}else if(s.includes("attack")||s.includes("kill")){m.trust-=40;r="Maya recoils and reaches for the nearest exit. Whatever trust existed between you is shattered."}else r=`You try: “${q}” Maya watches you, uncertain, but remembers what you chose to do.`}
else if(s.includes("roof")||s.includes("climb"))r=`You ${q.toLowerCase()}. From higher ground you spot a faint emergency light toward ${W[S.loc].links[0]}.`;
else if(s.includes("listen")||s.includes("radio"))r="You stop moving and listen. Beneath the static is a second transmission—your own breathing, delayed by three seconds.";
else if(s.includes("search")||s.includes("look")){searchArea();return}
else if(s.includes("sleep")||s.includes("rest")){rest();return}
else r=`You attempt: “${q}” The world responds within what is possible here. Nothing breaks the rules of what has already happened—but the action becomes part of your story.`;
story("YOUR ACTION — "+q);story(r)}
function setTab(t){tab=t;render()}
function render(){save();hp.textContent=S.hp;food.textContent=S.food;energy.textContent=S.energy;pack.textContent=S.inv.length+"/8";clock.textContent=`DAY ${S.day} • ${String(S.hour).padStart(2,"0")}:00`;sceneMeta.textContent=(S.hour<6||S.hour>=20?"NIGHT":"DAYLIGHT")+" • "+(S.hour>=20||S.hour<7?"HEAVY RAIN":"OVERCAST");loc.textContent=W[S.loc].i+" "+S.loc;desc.textContent=W[S.loc].d;radio.textContent=S.loc==="Radio Tower"?'📻 VOICE: “You’re standing directly above it.”':'📻 '+(S.flags.metMaya?'Static. Then: “Not everyone who hears me is infected.”':'VOICE: “If you can hear this, don’t go to the tower.”');
actions.innerHTML="";[["🔎 Search area",searchArea],["👁 Investigate",investigate],["💤 Rest",rest],["📻 Ask the Voice",askVoice]].forEach(([t,f])=>{let b=document.createElement("button");b.textContent=t;b.onclick=f;actions.appendChild(b)});
["tm","ti","tn","tj"].forEach(x=>document.getElementById(x).classList.remove("selected"));document.getElementById(tab==="map"?"tm":tab==="inventory"?"ti":tab==="people"?"tn":"tj").classList.add("selected");
if(tab==="map")content.innerHTML='<div class="label">CITY MAP • TAP A KNOWN LOCATION</div><div class="map">'+Object.keys(W).map(p=>`<div class="place ${p===S.loc?"here":""} ${S.seen.includes(p)?"":"lock"}" onclick="move('${p}')"><b>${W[p].i} ${p}</b><small>${p===S.loc?"YOU ARE HERE":S.seen.includes(p)?"ROUTE KNOWN":"UNDISCOVERED"}</small></div>`).join("")+"</div>";
if(tab==="inventory")content.innerHTML='<div class="label">BACKPACK • 8 SLOTS</div>'+ (S.inv.length?S.inv.map((x,i)=>`<div class="item"><b>${x}</b><button onclick="useItem(${i})">USE</button></div>`).join(""):"<p>Your pack is empty.</p>");
if(tab==="people"){let ps=Object.entries(S.people);content.innerHTML='<div class="label">PEOPLE YOU HAVE MET</div>'+(ps.length?ps.map(([n,p])=>`<div class="npcrow"><div><b>${n}</b><br><small style="color:var(--muted)">${p.status} • ${p.location}<br>${p.known}</small></div><span>${p.trust??10} trust</span></div>`).join(""):"<p>You haven't met anyone yet.</p>")}
if(tab==="journal")content.innerHTML='<div class="label">CONTINUITY LOG • YOUR CHOICES ARE CANON</div><div class="journal">'+S.journal.map(x=>`<div class="entry ${x.includes("VOICE:")?"story":""}">${x}</div>`).join("")+"</div>";
person.classList.toggle("show",S.flags.mayaJoined);alive()}
function restart(){localStorage.removeItem("tlcV3");location.reload()}
freeText.addEventListener("keydown",e=>{if(e.key==="Enter")freeAction()});render();
</script></body></html>
